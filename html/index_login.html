<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智学伴行 — 登录注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root { --primary: #1E3A5F; --secondary: #2563EB; --accent: #60A5FA; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #F0F4F8 0%, #DBEAFE 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-header .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .login-header .logo i { color: var(--secondary); margin-right: 6px; }
        .login-header .sub { color: #64748B; font-size: 0.9rem; }
        .login-card {
            background: #fff;
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(30,58,95,0.08);
        }
        .login-card h2 {
            font-size: 1.3rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }
        .form-control {
            border-radius: 8px;
            border: 1.5px solid #E2E8F0;
            padding: 10px 14px;
            font-size: 0.95rem;
            margin-bottom: 14px;
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
        }
        .btn-primary-custom {
            background: var(--secondary);
            border: none;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .btn-primary-custom:hover { background: #1D4ED8; }
        .toggle-link {
            color: var(--secondary);
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            margin-left: 4px;
        }
        .toggle-link:hover { text-decoration: underline; }
        .toggle-row {
            text-align: center;
            color: #64748B;
            font-size: 0.9rem;
            margin-top: 14px;
        }
        .beian{
            position: fixed;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #000000;
        }
        .beian a{
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-header">
            <div class="logo"><i class="fa fa-graduation-cap"></i>智学伴行</div>
            <div class="sub">AI大学生全能学习助手</div>
        </div>
        <div class="login-card">
            <h2 id="formTitle">登录</h2>
            <input type="email" id="email" class="form-control" placeholder="请输入邮箱">
            <input type="password" id="password" class="form-control" placeholder="请输入密码">
            <button class="btn-primary-custom" id="submitBtn">登录</button>
            <div class="toggle-row">
                <span id="toggleText">没有账号？</span>
                <a class="toggle-link" id="toggleMode" href="javascript:void(0)">去注册</a>
            </div>
        </div>
    </div>
    <div class="beian"><img src="./备案图标.png" style="width: 16px; height: 16px; margin-right: 4px;"><a href="https://beian.mps.gov.cn/#/query/webSearch?code=51010502015234" rel="noreferrer" target="_blank">川公网安备51010502015234号</a>  |  icp备案号:<a href="https://beian.miit.gov.cn/#/Integrated/recordQuery" target="_blank">蜀ICP备2024107334号-2</a></div>
    <script>
        axios.defaults.baseURL = 'https://cxcy.wangzai.icu/api8000';
        axios.defaults.withCredentials = true;
        let isLogin = true;

        document.getElementById('toggleMode').onclick = function() {
            isLogin = !isLogin;
            document.getElementById('formTitle').innerText = isLogin ? '登录' : '注册';
            document.getElementById('submitBtn').innerText = isLogin ? '登录' : '注册';
            document.getElementById('toggleText').innerText = isLogin ? '没有账号？' : '已有账号？';
            document.getElementById('toggleMode').innerText = isLogin ? '去注册' : '去登录';
        };

        document.getElementById('submitBtn').onclick = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) { alert("请输入邮箱和密码"); return; }
            try {
                const btn = document.getElementById('submitBtn');
                btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 处理中...';
                btn.disabled = true;
                if (isLogin) {
                    const res = await axios.post('/api/login', { email, password });
                    localStorage.setItem("userEmail", email);
                    document.cookie = `userEmail=${email}; max-age=604800; path=/;`;
                    window.location.href = "index.html";
                } else {
                    const res = await axios.post('/api/register', { email, password });
                    alert(res.data.message);
                    document.getElementById('toggleMode').click();
                }
            } catch (err) {
                alert(err.response?.data?.message || "请求失败");
            } finally {
                const btn = document.getElementById('submitBtn');
                btn.innerHTML = isLogin ? '登录' : '注册';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
